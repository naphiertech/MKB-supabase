name: CI

on:
  push:
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_DB_URL != ''
        with:
          version: 2.111.0
      - name: Run Supabase integration tests
        if: env.SUPABASE_DB_URL != ''
        working-directory: dashboard
        run: supabase test db --db-url "$SUPABASE_DB_URL" supabase/tests/database
      - name: Report missing database test configuration
        if: env.SUPABASE_DB_URL == ''
        run: echo "Supabase integration tests are skipped until the SUPABASE_DB_URL repository secret is configured."

  dashboard:
    runs-on: ubuntu-latest
    # Unit tests and this verification build do not contact Supabase, but the
    # client validates its Vite configuration when modules are imported.
    # Deployment workflows must provide the real project values separately.
    env:
      VITE_SUPABASE_URL: https://ci-test.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
