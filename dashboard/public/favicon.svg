<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- AttenRider Primary Brand Gradient -->
    <linearGradient id="arGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db6c00" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Lighting Highlight -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
    </linearGradient>

    <!-- Drop Shadow for High Contrast Browser Tabs -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a1410" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- MKB AttenRider Brand Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#arGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#innerGlow)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" />

  <!-- Center Symbol: Real-Time Activity Pulse + Geofence Location Node -->
  <g filter="url(#iconShadow)">
    <!-- Real-time Activity Telemetry Wave -->
    <path 
      d="M 115 260 H 180 L 220 170 L 265 350 L 310 215 L 335 260 H 397" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
    <!-- Geofence Pulse Node -->
    <circle cx="310" cy="215" r="22" fill="#ffffff" />
    <circle cx="310" cy="215" r="10" fill="#db6c00" />

    <!-- MKB Chevron Foundation Marker -->
    <path 
      d="M 165 388 L 256 424 L 347 388" 
      fill="none" 
      stroke="#ffffff" 
      stroke-opacity="0.55" 
      stroke-width="18" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
</svg>
