name: CI

on:
  push:
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against production connection
        working-directory: dashboard
        run: |
          # Ensure ephemeral local testing by eliminating any tracked or generated link metadata
          rm -f supabase/.temp/linked-project.json
          rm -f ../supabase/.temp/linked-project.json

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Initialize local Supabase config if absent
        working-directory: dashboard
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "Generating default local Supabase config..."
            supabase init
          fi

      - name: Start ephemeral local Supabase
        working-directory: dashboard
        run: supabase start

      - name: Verify applied migrations
        working-directory: dashboard
        run: supabase migration list --local

      - name: Run pgTAP database tests
        working-directory: dashboard
        run: supabase test db

      - name: Stop ephemeral local Supabase
        if: always()
        working-directory: dashboard
        run: supabase stop --no-backup

  dashboard:
    runs-on: ubuntu-latest
    # Unit tests and this verification build do not contact Supabase, but the
    # client validates its Vite configuration when modules are imported.
    # Deployment workflows must provide the real project values separately.
    env:
      VITE_SUPABASE_URL: https://ci-test.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  landing:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
